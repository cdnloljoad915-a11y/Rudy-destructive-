function initAudioContext() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function loadAudioBuffer(url, callback) {
    fetch(url)
        .then(response => response.arrayBuffer())
        .then(arrayBuffer => {
            const tempCtx = new AudioContext();
            return tempCtx.decodeAudioData(arrayBuffer);
        })
        .then(decodedBuffer => callback(decodedBuffer))
        .catch(err => console.error("Error al cargar audio:", err));
}

    initAudioContext();
    if (!shootAudioBuffer || !audioCtx) return;
    try {
        const source = audioCtx.createBufferSource();
        const gainNode = audioCtx.createGain();
        source.buffer = shootAudioBuffer;
        gainNode.gain.value = 2.5;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
    } catch (e) {}
}

function createGrassCanvas(burnt = false) {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    if (!burnt) {
        ctx.fillStyle = '#3a7d34'; ctx.fillRect(0, 0, 64, 64);
        for (let i = 0; i < 150; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#2e6329' : '#479e40';
            ctx.fillRect(Math.random() * 64, Math.random() * 64, 3, 3);
        }
    } else {
        ctx.fillStyle = '#1c1b18'; ctx.fillRect(0, 0, 64, 64);
        for (let i = 0; i < 150; i++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#111110' : '#2b2721';
            ctx.fillRect(Math.random() * 64, Math.random() * 64, 3, 3);
        }
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
    return texture;
}

function playAnimation(entity, shouldPlay) {
    if (!entity || !entity.mixer || !entity.action) return;
    if (shouldPlay) {
        if (!entity.action.isRunning()) {
            entity.action.reset();
            entity.action.play();
        }
        entity.action.paused = false;
    } else {
        entity.action.paused = true;
    }
}

    const dz = shooterPos.z - player.mesh.position.z;
    const angleToShooter = Math.atan2(dx, dz);
    let relAngle = angleToShooter - yaw;
    let deg = (relAngle * 180 / Math.PI) + 180;

    const arc = document.createElement('div');
    arc.className = 'damage-arc';
    arc.style.transform = `rotate(${deg}deg)`;
    damageContainer.appendChild(arc);

    requestAnimationFrame(() => { arc.style.opacity = '1'; });
    setTimeout(() => {
        arc.style.opacity = '0';
        setTimeout(() => { if (arc.parentNode) arc.parentNode.removeChild(arc); }, 500);
    }, 400);
}

function cloneUnlitMaterial(material) {
    const params = {
        color: material.color ? material.color.clone() : new THREE.Color(0xffffff),
        map: material.map || null,
        alphaMap: material.alphaMap || null,
        transparent: !!material.transparent,
        opacity: material.opacity !== undefined ? material.opacity : 1,
        alphaTest: material.alphaTest !== undefined ? material.alphaTest : 0,
        side: material.side !== undefined ? material.side : THREE.FrontSide,
        skinning: !!material.skinning
    };
    const basic = new THREE.MeshBasicMaterial(params);
    if (material.map) material.map.needsUpdate = true;
    if (material.alphaMap) material.alphaMap.needsUpdate = true;
    return basic;
}

function fixModelMaterials(model) {
    model.traverse((node) => {
        if (node.isMesh) {
            node.castShadow = false;
            node.receiveShadow = false;
            if (Array.isArray(node.material)) {
                node.material = node.material.map(cloneUnlitMaterial);
            } else if (node.material) {
                node.material = cloneUnlitMaterial(node.material);
            }
        }
    });
}

function createCharacterWrapper(gltfModel, yOffset = 0.0, rotationYOffset = 0) {
    const wrapper = new THREE.Group();
    const modelScene = THREE.SkeletonUtils.clone(gltfModel.scene);
    fixModelMaterials(modelScene);
    modelScene.position.y = yOffset;
    modelScene.rotation.y = rotationYOffset;
    wrapper.add(modelScene);
    let mixer = null, action = null;
    if (gltfModel.animations && gltfModel.animations.length > 0) {
        mixer = new THREE.AnimationMixer(modelScene);
        action = mixer.clipAction(gltfModel.animations[0]);
    }
    return { wrapper, innerScene: modelScene, mixer, action };
}

function triggerBarrelExplosion(barrelObj) {
    if (!barrelObj || barrelObj.isExploding) return;
    barrelObj.isExploding = true;

    let inflateInterval = setInterval(() => {
        if (!barrelObj) { clearInterval(inflateInterval); return; }
        barrelObj.inflateScale += 0.15;
        barrelObj.mesh.scale.set(barrelObj.inflateScale, barrelObj.inflateScale, barrelObj.inflateScale);

        if (barrelObj.inflateScale >= 2.4) {
            clearInterval(inflateInterval);
            executeEpicExplosion(barrelObj);
        }
    }, 40);
}

function executeEpicExplosion(barrelObj) {
    if (!barrelObj) return;
    const pos = barrelObj.mesh.position.clone();
    pos.y += 0.8;

    removeBarrel(barrelObj);
    cameraShakeIntensity = 3.5;

    for (let i = 0; i < 20; i++) {
        const pMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff3300 : 0xffaa00 });
        const p = new THREE.Mesh(bloodGeo, pMat);
        p.position.copy(pos);
        const dir = new THREE.Vector3((Math.random() - 0.5) * 1.2, Math.random() * 1.0 + 0.2, (Math.random() - 0.5) * 1.2);
        particles.push({ mesh: p, vel: dir, life: 25 });
        scene.add(p);
    }
    for (let i = 0; i < 10; i++) spawnSmokeParticle(pos);

    const ringGeo = new THREE.RingGeometry(0.2, 2.0, 16);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff6600, side: THREE.DoubleSide, transparent: true, opacity: 1 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = -Math.PI / 2;
    ringMesh.position.copy(pos);
    ringMesh.position.y = 0.1;
    scene.add(ringMesh);

    let ringRadius = 2.0;
    let ringInterval = setInterval(() => {
        ringRadius += 1.8;
        ringMesh.scale.set(ringRadius, ringRadius, 1);
        ringMat.opacity -= 0.08;
        if (ringMat.opacity <= 0) {
            clearInterval(ringInterval);
            scene.remove(ringMesh);
            ringGeo.dispose();
            ringMat.dispose();
        }
    }, 30);

    const explosionRadius = 14.0;

    for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        if (en.alive && en.mesh.position.distanceTo(pos) <= explosionRadius) {
            en.alive = false;
            playDeathKillSound(2.0);
            spawnBlood(en.mesh.position, 10);
            scene.remove(en.mesh);
            enemies.splice(i, 1);
        }
    }

    for (let i = miniAles.length - 1; i >= 0; i--) {
        const ma = miniAles[i];
        if (ma.alive && ma.mesh.position.distanceTo(pos) <= explosionRadius) {
            ma.alive = false;
            playDeathKillSound(2.0);
            spawnBlood(ma.mesh.position, 10);
            scene.remove(ma.mesh);
            miniAles.splice(i, 1);
        }
    }

    checkRoundProgress();
    updateHUDCounts();

    const playerDist = player.mesh.position.distanceTo(pos);
    if (playerDist <= explosionRadius && player.isAlive && !isEndingSequence && !isGodMode) {
        const damage = Math.floor(100 * (1 - playerDist / explosionRadius));
        player.health -= Math.max(30, damage);
        healthFill.style.width = Math.max(0, player.health) + '%';
        spawnBlood(player.mesh.position, 10);
        if (player.health <= 0) killPlayerAlways();
    }

    for (let i = activeBosses.length - 1; i >= 0; i--) {
        const b = activeBosses[i];
        if (b.alive && b.mesh.position.distanceTo(pos) <= explosionRadius + 4.0) {
            b.health -= 1200;
            spawnBlood(b.mesh.position, 20);
            updateBossHUD();
            if (b.health <= 0) {
                b.alive = false;
                if (b.type === 'RADIOACTIVE') triggerBossDefeatSequence(b);
                else defeatAleBoss(b);
            }
        }
    }
}

function updateCameraPosition() {
    if (isEndingSequence) return;

    let shakeX = (Math.random() - 0.5) * cameraShakeIntensity;
    let shakeY = (Math.random() - 0.5) * cameraShakeIntensity;
    let crouchCamOffset = player.isCrouched ? -0.5 : 0.0;

    if (cameraPerspective === 'THIRD') {
        const camOffset = new THREE.Vector3(0, 3.0 + crouchCamOffset, 6.5);
        camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        
        camera.position.x = player.mesh.position.x + camOffset.x + shakeX;
        camera.position.y = player.mesh.position.y + camOffset.y + Math.sin(pitch) * 2.0 + shakeY;
        camera.position.z = player.mesh.position.z + camOffset.z;
        
        const lookTarget = player.mesh.position.clone();
        lookTarget.y += 1.3 + crouchCamOffset;
        camera.lookAt(lookTarget);
        
        if (player.modelContainer) player.modelContainer.visible = true;
    } else {
        camera.position.x = player.mesh.position.x + shakeX;
        camera.position.y = player.mesh.position.y + 1.4 + crouchCamOffset + shakeY;
        camera.position.z = player.mesh.position.z;
        
        const dir = new THREE.Vector3(0, 0, -1);
        dir.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
        dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        
        camera.lookAt(camera.position.clone().add(dir));
        if (player.modelContainer) player.modelContainer.visible = false;
    }

    if (cameraShakeIntensity > 0) {
        cameraShakeIntensity *= 0.88;
        if (cameraShakeIntensity < 0.01) cameraShakeIntensity = 0;
    }
}

function resetGame(keepFreeModeWorld = false) {
    if (!keepFreeModeWorld) {
        bossMusic.pause(); bossMusic.currentTime = 0;
        aleMusic.pause(); aleMusic.currentTime = 0;
    }
    if (infiniteSpawnerTimer) {
        clearInterval(infiniteSpawnerTimer);
        infiniteSpawnerTimer = null;
    }

    if (!keepFreeModeWorld) {
        removeAllEnemies();
        removeAllBarrels();
        
        playerBullets.forEach(pb => scene.remove(pb.mesh));
        enemyBullets.forEach(eb => scene.remove(eb.mesh));
        particles.forEach(p => scene.remove(p.mesh));
        meteorZones.forEach(m => scene.remove(m.mesh));
        smokeParticles.forEach(sp => scene.remove(sp.mesh));
        aleParticles.forEach(ap => scene.remove(ap.mesh));
        if (cinematicRudy && cinematicRudy.mesh) scene.remove(cinematicRudy.mesh);

        playerBullets.length = 0; enemyBullets.length = 0; particles.length = 0; meteorZones.length = 0; smokeParticles.length = 0; aleParticles.length = 0;
        cinematicRudy = null;
        bossHudContainer.innerHTML = '';
    }

    isEndingSequence = false;
    damageContainer.innerHTML = '';
    
    player.health = 100; player.isAlive = true; player.mesh.position.set(0, 0, 0);
    player.mesh.rotation.set(0, 0, 0);

        player.modelContainer.position.set(0, 0, 0);

                });

    }

function spawnGreenWarningParticleGroup(targetPos, duration = 2.0) {
    const group = new THREE.Group();
    group.position.copy(targetPos);
    group.position.y = 1.0;

    const pCount = 12;
    const parts = [];

    for (let i = 0; i < pCount; i++) {
        const p = new THREE.Mesh(greenParticleGeo, greenParticleMat);
        const radius = 1.5 + Math.random() * 0.5;
        const angle = (i / pCount) * Math.PI * 2;
        p.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 1.5, Math.sin(angle) * radius);
        group.add(p);
        parts.push({ mesh: p, angle: angle, radius: radius, speed: 0.08 + Math.random() * 0.04 });
    }

    scene.add(group);
    cyanWarnings.push({ group: group, parts: parts, timer: 0, duration: duration, targetPos: targetPos.clone() });
}

function createMassiveLaserBeam(startPos, targetPos) {
    const laserMesh = new THREE.Mesh(laserGeo, laserMat);
    const distance = startPos.distanceTo(targetPos);
    laserMesh.scale.set(1.5, distance, 1.5);
    
    const midPoint = new THREE.Vector3().addVectors(startPos, targetPos).multiplyScalar(0.5);
    laserMesh.position.copy(midPoint);
    
    laserMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(targetPos, startPos).normalize());
    
    scene.add(laserMesh);
    laserBeams.push({ mesh: laserMesh, targetPos: targetPos.clone(), startPos: startPos.clone(), time: 0, damagedPlayer: false });
}

function triggerAleAttack(aleBossObj) {
    if (!aleBossObj || !loadedAleAttackGltf || isIgnored || !player.isAlive) return;
    aleBossObj.state = 'ATTACKING';

    const pos = aleBossObj.mesh.position.clone();
    const rot = aleBossObj.mesh.rotation.clone();

    scene.remove(aleBossObj.mesh);

    const attackObj = createCharacterWrapper(loadedAleAttackGltf, 0, 0);
    attackObj.wrapper.scale.set(3.5, 3.5, 3.5);
    attackObj.wrapper.position.copy(pos);
    attackObj.wrapper.rotation.copy(rot);
    scene.add(attackObj.wrapper);

    aleBossObj.mesh = attackObj.wrapper;
    aleBossObj.charObj = attackObj;
    aleBossObj.mixer = attackObj.mixer;
    aleBossObj.action = attackObj.action;

    const attackChoice = Math.random();

    if (attackChoice < 0.25) {
        const ball = new THREE.Mesh(greenBallGeo, greenBallMat);
        ball.position.copy(aleBossObj.mesh.position);
        ball.position.y += 1.0;
        
        const dir = new THREE.Vector3().subVectors(player.mesh.position, ball.position).normalize();
        enemyBullets.push({ mesh: ball, dir: dir, time: 0, originPos: aleBossObj.mesh.position.clone(), isGreenBall: true });
        scene.add(ball);

        setTimeout(() => restoreAleHovering(aleBossObj), 600);

    } else if (attackChoice < 0.50) {
        const targetPoint = player.mesh.position.clone();
        targetPoint.y = 0;

        spawnGreenWarningParticleGroup(targetPoint, 2.0);

        setTimeout(() => {
            if (aleBossObj && aleBossObj.alive) {
                createMassiveLaserBeam(aleBossObj.mesh.position.clone(), targetPoint);
            }
            restoreAleHovering(aleBossObj);
        }, 2000);

    } else if (attackChoice < 0.75) {
        triggerAleKineticShield(aleBossObj);
        setTimeout(() => restoreAleHovering(aleBossObj), 700);

    } else {
        triggerAlePhotonicRain();
        if (miniAles.length < 6) {
            for (let i = 0; i < 2; i++) {
                if (miniAles.length >= 6) break;
                const spawnPos = aleBossObj.mesh.position.clone().add(new THREE.Vector3(

                spawnMiniAle(spawnPos);
            }
        }
        setTimeout(() => restoreAleHovering(aleBossObj), 800);
    }

function triggerBossDefeatSequence(bossObj) {
    bossObj.alive = false;

    if (idx !== -1) activeBosses.splice(idx, 1);

        }, 500);

        if (currentMode !== 'STORY') {
            if (bossObj.mesh) scene.remove(bossObj.mesh);
            return;
        }

        if (currentMode === 'STORY') {
            isStoryCompleted = true;
            localStorage.setItem('storyCompleted', 'true');
            checkModesUnlocked();
        }

        if (activeBosses.length > 0) {
            if (bossObj.mesh) scene.remove(bossObj.mesh);
            return;
        }
        
        setHUDVisible(false);
        isEndingSequence = true;

        removeAllEnemies();
        removeAllBarrels();

        floor.material = burntFloorMat;

        if (bossObj && bossObj.mesh) {
            bossObj.mesh.position.set(player.mesh.position.x, 0.4, player.mesh.position.z - 6.0);
            bossObj.mesh.rotation.set(Math.PI / 2, 0, 0);
            
            const blackMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            bossObj.mesh.traverse((node) => { if (node.isMesh) node.material = blackMat; });
        }

        if (player.modelContainer) {
            player.modelContainer.visible = true;
            player.modelContainer.scale.set(1.2, 1.2, 1.2);
            player.modelContainer.position.set(0, 0, 0);
            player.modelContainer.rotation.set(0, 0, 0);
        }

        player.mesh.rotation.y = Math.PI; 
        yaw = Math.PI;

        player.isMoving = true;

        setTimeout(() => {
            let smokeTimer = setInterval(() => {
                if (bossObj && bossObj.mesh) spawnSmokeParticle(bossObj.mesh.position);
            }, 150);

            let walkInterval = setInterval(() => {
                player.mesh.position.z += 0.08;
                camera.position.set(player.mesh.position.x + 3.0, player.mesh.position.y + 2.2, player.mesh.position.z - 5.0);
                camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1.0, player.mesh.position.z + 3.0);
            }, 16);

            setTimeout(() => {
                clearInterval(walkInterval);
                clearInterval(smokeTimer);
                fadeOverlay.style.display = 'block';
                fadeOverlay.style.opacity = '1';

                setTimeout(() => {
                    resetGame();
                    mainMenu.style.display = 'flex';
                    gameState = 'MENU';
                }, 1500);
            }, 4000);
        }, 800);
    }, 500);
}

function startCinematicSequence() {
    resetGame();
    currentMode = 'STORY';
    cameraPerspective = 'THIRD';
    mainMenu.style.display = 'none';
    gameState = 'STORY_CINEMATIC';
    storyPhase = 'CINEMATIC';

    player.mesh.position.set(0, 0, 0);
    yaw = Math.PI;
    updateCameraPosition();

    if (player.modelContainer) {
        player.modelContainer.rotation.x = -Math.PI / 2;
        player.modelContainer.position.y = 0.3;
    }

    let riseProgress = 0;
    const riseInterval = setInterval(() => {
        riseProgress += 0.04;
        if (player.modelContainer) {
            player.modelContainer.rotation.x = (-Math.PI / 2) * (1 - Math.min(1, riseProgress));
            player.modelContainer.position.y = 0.3 * (1 - Math.min(1, riseProgress));
        }
        if (riseProgress >= 1) clearInterval(riseInterval);
    }, 50);

    setTimeout(() => {
        fadeOverlay.style.display = 'block';
        fadeOverlay.style.opacity = '1';

        setTimeout(() => {
            fadeOverlay.style.opacity = '0';
            setTimeout(() => { fadeOverlay.style.display = 'none'; }, 1000);

            if (player.modelContainer) {
                player.modelContainer.rotation.x = 0;
                player.modelContainer.position.y = 0;
            }

            storyPhase = 'COMBAT';
            gameState = 'PLAYING_GAME';
            setHUDVisible(true);

            setTimeout(() => { spawnStoryEnemies(1); }, 300);
        }, 1200);
    }, 3500);
}

function playerShoot() {

        tmpPos.copy(player.mesh.position);

        tmpDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        tmpDir.normalize();

        tmpPos.copy(camera.position);
        tmpDir.set(0, 0, -1);
        tmpDir.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
        tmpDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        tmpDir.normalize();
    }

window.addEventListener('touchstart', (e) => {
    if (gameState !== 'PLAYING_GAME' || isEndingSequence) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.target === jumpBtn || touch.target === shootBtn || touch.target === crouchBtn || touch.target === exitMenuBtn || touch.target === camToggleBtn || touch.target === secretBtn || touch.target === freeModeToggleBtn || freeModePanel.contains(touch.target)) continue;
        
        if (joyTouchId === null && joyContainer.contains(touch.target)) {
            joyTouchId = touch.identifier;
            const rect = joyContainer.getBoundingClientRect();
            joyStartX = rect.left + rect.width / 2; 
            joyStartY = rect.top + rect.height / 2;
            updateJoystickPos(touch.clientX, touch.clientY);
        } else if (!joyContainer.contains(touch.target)) {
            activeTouches[touch.identifier] = { lastX: touch.clientX, lastY: touch.clientY };
        }
    }
}, { passive: false });

function updateJoystickPos(clientX, clientY) {
    let dx = clientX - joyStartX;
    let dy = clientY - joyStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > maxRadius) { 
        dx = (dx / dist) * maxRadius; 
        dy = (dy / dist) * maxRadius; 
    }
    
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    moveInput.x = dx / maxRadius; 
    moveInput.y = dy / maxRadius;
}

window.addEventListener('touchmove', (e) => {
    if (gameState !== 'PLAYING_GAME' || isEndingSequence) return;
    for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        if (touch.identifier === joyTouchId) {
            updateJoystickPos(touch.clientX, touch.clientY);
        } else if (activeTouches[touch.identifier]) {
            const tData = activeTouches[touch.identifier];
            yaw -= (touch.clientX - tData.lastX) * 0.005; 
            pitch -= (touch.clientY - tData.lastY) * 0.005;
            tData.lastX = touch.clientX; 
            tData.lastY = touch.clientY;
        }
    }
}, { passive: false });

window.addEventListener('touchend', (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
            joyTouchId = null; 
            knob.style.transform = 'translate(-50%, -50%)'; 
            moveInput.x = 0; 
            moveInput.y = 0;
        } else if (activeTouches[touch.identifier]) { 
            delete activeTouches[touch.identifier]; 
        }
    }
});

const keys = { w: false, a: false, s: false, d: false };
window.addEventListener('keydown', (e) => { 
    const k = e.key.toLowerCase(); 
    if (k in keys) keys[k] = true; 
    if (e.key === " ") triggerJump(); 
    if (k === "c" || e.key === "Control") toggleCrouchPlayer();
});
window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

function checkRoundProgress() {
    if (currentMode !== 'STORY' || activeBosses.length > 0) return;
    if (enemies.length === 0) {
        if (currentRound === 1) { currentRound = 2; spawnStoryEnemies(3); }
        else if (currentRound === 2) { currentRound = 3; spawnStoryEnemies(5); }
        else if (currentRound === 3) { currentRound = 4; spawnStoryEnemies(7); }
        else if (currentRound === 4) { currentRound = 5; spawnStoryEnemies(9); }
        else if (currentRound === 5) {
            spawnBossFinal();
        }
    }
    updateHUDCounts();
}

function triggerMeteorRain() {
    for (let i = 0; i < 4; i++) {
        const circleGeo = new THREE.CircleGeometry(3.5, 16);
        const circleMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        const mMesh = new THREE.Mesh(circleGeo, circleMat);
        mMesh.rotation.x = -Math.PI / 2;
        
        const offsetX = (Math.random() - 0.5) * 30;
        const offsetZ = (Math.random() - 0.5) * 30;
        mMesh.position.set(player.mesh.position.x + offsetX, 0.05, player.mesh.position.z + offsetZ);
        
        scene.add(mMesh);
        meteorZones.push({ mesh: mMesh, timer: performance.now(), duration: 2000, radius: 3.5, detonated: false });
    }
}

function animate() {
    requestAnimationFrame(animate);
    if (gameState === 'MENU') { renderer.render(scene, camera); return; }

    const delta = Math.min(clock.getDelta(), 0.05), now = performance.now();

    if (player.mixer) player.mixer.update(delta);
    playAnimation(player, player.isMoving && player.isAlive);

    for (let i = 0; i < enemies.length; i++) {
        const en = enemies[i];
        if (en.mixer) en.mixer.update(delta);
        playAnimation(en, en.isMoving && en.alive);
    }

    for (let i = 0; i < miniAles.length; i++) {
        const ma = miniAles[i];
        if (ma.mixer) ma.mixer.update(delta);
        playAnimation(ma, ma.alive);
    }

    for (let i = 0; i < activeBosses.length; i++) {
        const boss = activeBosses[i];
        if (boss.mixer) boss.mixer.update(delta);
        playAnimation(boss, boss.alive && (boss.state === 'MOVING' || boss.state === 'HOVERING' || boss.state === 'ATTACKING'));
    }

    if (gameState === 'STORY_CINEMATIC') {
        updateCameraPosition();
        renderer.render(scene, camera);
        return;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i]; p.mesh.position.addScaledVector(p.vel, 0.4); p.life -= 1;
        if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
    }

    for (let i = aleParticles.length - 1; i >= 0; i--) {
        const ap = aleParticles[i]; ap.mesh.position.addScaledVector(ap.vel, 0.4); ap.life -= 1;
        if (ap.life <= 0) { scene.remove(ap.mesh); aleParticles.splice(i, 1); }
    }

    for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const sp = smokeParticles[i];
        sp.mesh.position.addScaledVector(sp.vel, 0.5);
        sp.life -= 1;
        sp.mesh.material.opacity = (sp.life / 30) * 0.6;
        if (sp.life <= 0) {
            scene.remove(sp.mesh);
            smokeParticles.splice(i, 1);
        }
    }

    for (let i = aleShields.length - 1; i >= 0; i--) {
        const s = aleShields[i];
        s.radius += s.growthRate * delta;
        s.mesh.scale.set(s.radius, 1, s.radius);
        s.mesh.material.opacity = 0.7 * (1.0 - s.radius / s.maxRadius);

        const dist = s.mesh.position.distanceTo(player.mesh.position);
        if (dist <= s.radius + 0.8 && !s.pushedPlayer && player.isAlive && !isEndingSequence) {
            const pushDir = new THREE.Vector3().subVectors(player.mesh.position, s.mesh.position).normalize();
            if (pushDir.lengthSq() === 0) pushDir.set(0, 0, 1);
            
            player.mesh.position.addScaledVector(pushDir, 10.0);
            velocityY = 0.2;
            isGrounded = false;

            if (!isGodMode) {
                player.health -= 15;
                healthFill.style.width = Math.max(0, player.health) + '%';
                spawnBlood(player.mesh.position, 8);
                showDamageIndicator(s.mesh.position);
                if (player.health <= 0) killPlayerAlways();
            }
            s.pushedPlayer = true;
        }

        if (s.radius >= s.maxRadius) {
            scene.remove(s.mesh);
            aleShields.splice(i, 1);
        }
    }

    for (let i = alePhotonicZones.length - 1; i >= 0; i--) {
        const pz = alePhotonicZones[i];
        const elapsed = now - pz.timer;
        pz.mesh.material.opacity = 0.3 + (Math.sin(elapsed * 0.015) * 0.3);

        if (elapsed >= pz.duration && !pz.detonated) {
            pz.detonated = true;
            cameraShakeIntensity = 1.0;
            const dist = player.mesh.position.distanceTo(pz.mesh.position);
            if (dist < pz.radius && player.isAlive && !isEndingSequence && !isGodMode) {
                player.health -= 30;
                healthFill.style.width = Math.max(0, player.health) + '%';
                spawnBlood(player.mesh.position, 10);
                if (player.health <= 0) killPlayerAlways();
            }
            scene.remove(pz.mesh);
            alePhotonicZones.splice(i, 1);
        }
    }

    for (let i = cyanWarnings.length - 1; i >= 0; i--) {
        const cw = cyanWarnings[i];
        cw.timer += delta;
        
        cw.parts.forEach(p => {
            p.angle += p.speed;
            p.mesh.position.x = Math.cos(p.angle) * p.radius;
            p.mesh.position.z = Math.sin(p.angle) * p.radius;
        });

        if (cw.timer >= cw.duration) {
            scene.remove(cw.group);
            cyanWarnings.splice(i, 1);
        }
    }

    for (let i = laserBeams.length - 1; i >= 0; i--) {
        const lb = laserBeams[i];
        lb.time += delta;

        if (!lb.damagedPlayer) {
            const distToPlayer = player.mesh.position.distanceTo(lb.targetPos);
            if (distToPlayer < 4.0 && player.isAlive && !isEndingSequence && !isGodMode) {
                player.health -= 50;
                healthFill.style.width = Math.max(0, player.health) + '%';
                spawnBlood(player.mesh.position, 12);
                showDamageIndicator(lb.startPos);
                lb.damagedPlayer = true;
                if (player.health <= 0) killPlayerAlways();
            }
        }

        if (lb.time > 0.8) {
            scene.remove(lb.mesh);
            laserBeams.splice(i, 1);
        }
    }

    for (let i = meteorZones.length - 1; i >= 0; i--) {
        const m = meteorZones[i];
        const elapsed = now - m.timer;
        m.mesh.material.opacity = 0.3 + (Math.sin(elapsed * 0.01) * 0.3);
        
        if (elapsed >= m.duration && !m.detonated) {
            m.detonated = true;
            cameraShakeIntensity = 0.8;
            const dist = player.mesh.position.distanceTo(m.mesh.position);
            if (dist < m.radius && player.isAlive && !isEndingSequence && !isGodMode) {
                player.health -= 35;
                healthFill.style.width = Math.max(0, player.health) + '%';
                spawnBlood(player.mesh.position, 8);
                if (player.health <= 0) killPlayerAlways();
            }
            scene.remove(m.mesh);
            meteorZones.splice(i, 1);
        }
    }

    for (let i = playerBullets.length - 1; i >= 0; i--) {
        const pb = playerBullets[i];
        pb.mesh.position.addScaledVector(pb.dir, (pb.speed || LOCAL_BULLET_SPEED) * delta);
        pb.time += delta;
        let hit = false;
        
        for (let bIdx = barrelsList.length - 1; bIdx >= 0; bIdx--) {
            const barrel = barrelsList[bIdx];
            if (!barrel.isExploding) {
                tmpVec.copy(barrel.mesh.position);
                tmpVec.y += 0.8;
                if (pb.mesh.position.distanceTo(tmpVec) < barrel.radius + 0.3) {
                    hit = true;
                    barrel.health -= 35;
                    spawnBlood(pb.mesh.position, 4);
                    if (barrel.health <= 0) triggerBarrelExplosion(barrel);
                    break;
                }
            }
        }

        for (let bIdx = activeBosses.length - 1; bIdx >= 0; bIdx--) {
            const boss = activeBosses[bIdx];
            if (boss.alive) {
                tmpVec.copy(boss.mesh.position);
                tmpVec.y += 2.0;
                if (pb.mesh.position.distanceTo(tmpVec) < (boss.type === 'RADIOACTIVE' ? 6.5 : 4.5)) {
                    hit = true;
                    boss.health -= 20;
                    spawnBlood(pb.mesh.position, 8);
                    updateBossHUD();

                    if (boss.health <= 0) {
                        boss.alive = false;
                        if (boss.type === 'RADIOACTIVE') triggerBossDefeatSequence(boss);
                        else defeatAleBoss(boss);
                    }
                    break;
                }
            }
        }

        for (let j = miniAles.length - 1; j >= 0; j--) {
            const ma = miniAles[j];
            if (ma.alive && pb.mesh.position.distanceTo(ma.mesh.position) < ma.radius + 0.5) {
                hit = true; 
                ma.health -= 20;
                spawnBlood(pb.mesh.position, 6);
                if (ma.health <= 0) {
                    ma.alive = false;
                    playDeathKillSound(1.5);
                    scene.remove(ma.mesh);
                    miniAles.splice(j, 1);
                }
                break;
            }
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
            const en = enemies[j];
            tmpVec.copy(en.mesh.position);
            tmpVec.y += 0.8;
            if (en.alive && pb.mesh.position.distanceTo(tmpVec) < en.radius + 0.4) {
                hit = true; en.health -= 20; spawnBlood(pb.mesh.position, 8);
                if (en.health <= 0) {
                    en.alive = false; 
                    playDeathKillSound(2.0);
                    scene.remove(en.mesh); 
                    enemies.splice(j, 1);
                    checkRoundProgress();
                    updateHUDCounts();
                }
                break;
            }
        }
        if (pb.mesh.position.y < 0) hit = true;
        if (hit || pb.time > 2.0) { scene.remove(pb.mesh); playerBullets.splice(i, 1); }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.mesh.position.addScaledVector(eb.dir, eb.isGreenBall ? 0.75 : 0.9);
        eb.time += delta;
        
        for (let bIdx = barrelsList.length - 1; bIdx >= 0; bIdx--) {
            const barrel = barrelsList[bIdx];
            if (!barrel.isExploding) {
                tmpVec.copy(barrel.mesh.position);
                tmpVec.y += 0.8;
                if (eb.mesh.position.distanceTo(tmpVec) < barrel.radius + 0.3) {
                    barrel.health -= 25;
                    spawnBlood(eb.mesh.position, 4);
                    if (barrel.health <= 0) triggerBarrelExplosion(barrel);
                    scene.remove(eb.mesh); enemyBullets.splice(i, 1); continue;
                }
            }
        }

        tmpVec.copy(player.mesh.position);
        tmpVec.y += (player.isCrouched ? 0.6 : player.height) / 2;
        if (player.isAlive && !isEndingSequence && eb.mesh.position.distanceTo(tmpVec) < player.radius + (eb.isGreenBall ? 1.6 : 0.3)) {
            if (!isGodMode) {
                if (eb.isGreenBall) {
                    player.health = 0;
                } else {
                    player.health -= 4;
                }
                healthFill.style.width = Math.max(0, player.health) + '%'; spawnBlood(tmpVec, 8);
                showDamageIndicator(eb.originPos || eb.mesh.position);
                if (player.health <= 0) killPlayerAlways();
            }
            scene.remove(eb.mesh); enemyBullets.splice(i, 1); continue;
        }
        if (eb.time > 3.5 || eb.mesh.position.y < 0) { scene.remove(eb.mesh); enemyBullets.splice(i, 1); }
    }

    if (player.isAlive && !isEndingSequence) {
        pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 3, pitch));
        player.mesh.rotation.y = yaw;
        
        let moveX = moveInput.x, moveZ = moveInput.y;
        if (keys.w) moveZ = -1; if (keys.s) moveZ = 1;
        if (keys.a) moveX = -1; if (keys.d) moveX = 1;
        
        const isMovingNow = (moveX !== 0 || moveZ !== 0);
        
        if (isMovingNow && !player.isMoving) {
            player.isMoving = true;
        } else if (!isMovingNow && player.isMoving) {
            player.isMoving = false;
        }

        let currentMoveSpeed = baseSpeed * playerSpeedMultiplier;
        if (player.isCrouched) currentMoveSpeed *= 0.5;
        
        velocityY += gravity;
        let nextPos = player.mesh.position.clone();

        if (isMovingNow) {
            const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize();
            moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            nextPos.addScaledVector(moveVec, currentMoveSpeed);
        }
        nextPos.y += velocityY;

        barrelsList.forEach(barrel => {
            if (!barrel.isExploding) {
                const bPos = barrel.mesh.position;
                const distToBarrel = Math.hypot(nextPos.x - bPos.x, nextPos.z - bPos.z);
                const minDist = player.radius + barrel.radius;
                if (distToBarrel < minDist) {
                    const pushAngle = Math.atan2(nextPos.z - bPos.z, nextPos.x - bPos.x);
                    nextPos.x = bPos.x + Math.cos(pushAngle) * minDist;
                    nextPos.z = bPos.z + Math.sin(pushAngle) * minDist;
                }
            }
        });

        const boundLimit = halfMap - 3.0;
        nextPos.x = Math.max(-boundLimit, Math.min(boundLimit, nextPos.x));
        nextPos.z = Math.max(-boundLimit, Math.min(boundLimit, nextPos.z));

        isGrounded = false;
        if (nextPos.y <= 0) {
            nextPos.y = 0;
            velocityY = 0;
            isGrounded = true;
        }

        if (player.isMoving && isGrounded) {
            if (now - playerLastStepTime > 320) {
                playStepSound(3.0);
                playerLastStepTime = now;
            }
        }

        player.mesh.position.copy(nextPos);
        updateCameraPosition();
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        if (!en.alive) continue;

        if (isIgnored || !player.isAlive) {
            en.changeDirTimer += delta;
            if (en.changeDirTimer > 2.0) {
                en.randomDir.set((Math.random()-0.5)*2, 0, (Math.random()-0.5)*2).normalize();
                en.changeDirTimer = 0;
            }
            en.mesh.position.addScaledVector(en.randomDir, en.speed * 0.5);
            en.mesh.lookAt(en.mesh.position.clone().add(en.randomDir));
            en.isMoving = true;
        } else {
            en.mesh.lookAt(player.mesh.position.x, 0, player.mesh.position.z);

            const dist = en.mesh.position.distanceTo(player.mesh.position);
            const stopDist = en.stopDistance || 14.0;

            if (dist > stopDist) {
                const moveVec = new THREE.Vector3().subVectors(player.mesh.position, en.mesh.position).normalize();
                en.mesh.position.addScaledVector(moveVec, en.speed);
                en.isMoving = true;
            } else {
                en.isMoving = false;
                if (now - en.lastShootTime > 2500 + Math.random() * 1500) {
                    enemyShootBurst(en);
                    en.lastShootTime = now;
                }
            }
            en.mesh.position.y = 0; 
        }
    }

    for (let i = miniAles.length - 1; i >= 0; i--) {
        const ma = miniAles[i];
        if (!ma.alive) continue;

        if (isIgnored || !player.isAlive) {
            ma.changeDirTimer += delta;
            if (ma.changeDirTimer > 2.0) {
                ma.randomDir.set((Math.random()-0.5)*2, 0, (Math.random()-0.5)*2).normalize();
                ma.changeDirTimer = 0;
            }
            ma.mesh.position.addScaledVector(ma.randomDir, ma.speed * 0.5);
            ma.mesh.lookAt(ma.mesh.position.clone().add(ma.randomDir));
        } else {
            ma.mesh.lookAt(player.mesh.position.x, ma.mesh.position.y, player.mesh.position.z);
            
            const moveVec = new THREE.Vector3().subVectors(player.mesh.position, ma.mesh.position).normalize();
            
            ma.dashTimer += delta;
            if (ma.dashTimer > ma.dashCooldown) {
                ma.isDashing = true;
                setTimeout(() => { ma.isDashing = false; }, 400);
                ma.dashTimer = 0;
            }

            let speed = ma.isDashing ? ma.speed * 2.8 : ma.speed;
            ma.mesh.position.addScaledVector(moveVec, speed);
            
            ma.mesh.position.y = ma.flyingY + Math.sin(now * 0.005 + ma.hoverOffset) * 0.1;

            const dist = ma.mesh.position.distanceTo(player.mesh.position);
            if (dist < 1.2 && player.isAlive && !isEndingSequence) {
                if (!isGodMode) {
                    player.health -= 17;
                    healthFill.style.width = Math.max(0, player.health) + '%';
                    spawnBlood(player.mesh.position, 6);
                    showDamageIndicator(ma.mesh.position);
                    if (player.health <= 0) killPlayerAlways();
                }

                ma.alive = false;
                scene.remove(ma.mesh);
                miniAles.splice(i, 1);
            }
        }
    }

    activeBosses.forEach(bossObj => {
        if (!bossObj.alive) return;

        if (bossObj.type === 'RADIOACTIVE') {
            bossObj.moveTimer += delta;
            bossStepTimer += delta;

            if (bossStepTimer >= 0.5) {
                bossStepTimer = 0;
                cameraShakeIntensity = 0.35;
            }

            if (!isIgnored && player.isAlive) {
                if (bossObj.state === 'MOVING') {
                    bossObj.mesh.position.x += bossObj.moveDir * delta * 2.5;
                    if (Math.abs(bossObj.mesh.position.x) > 15) bossObj.moveDir *= -1;
                    bossObj.mesh.lookAt(player.mesh.position.x, 0, player.mesh.position.z);

                    if (bossObj.moveTimer > 4.0) {
                        const rand = Math.random();
                        if (rand < 0.20) {
                            bossObj.state = 'SUMMONING';
                            spawnEvolvingMinions(bossObj);
                            bossObj.moveTimer = 0;
                            bossObj.state = 'MOVING';
                        } else if (rand < 0.60) {
                            bossObj.state = 'CHARGING_EARTHQUAKE';
                            bossObj.stateTimer = now;
                        } else {
                            bossObj.state = 'METEOR_ATTACK';
                            triggerMeteorRain();
                            bossObj.moveTimer = 0;
                            bossObj.state = 'MOVING';
                        }
                    }

                } else if (bossObj.state === 'CHARGING_EARTHQUAKE') {
                    bossObj.mesh.lookAt(player.mesh.position.x, 0, player.mesh.position.z);
                    const elapsed = (now - bossObj.stateTimer) / 1000;

                    if (elapsed >= 2.0) {
                        bossObj.state = 'EARTHQUAKE_ACTIVE';
                        bossObj.stateTimer = now;
                        bossObj.shockwaveRadius = 0.5;
                        bossObj.shockwaveMesh.position.copy(bossObj.mesh.position);
                        bossObj.shockwaveMesh.scale.set(1, 1, 1);
                        bossObj.shockwaveMesh.visible = true;
                        bossObj.shockwaveMesh.material.opacity = 1.0;
                    }

                } else if (bossObj.state === 'EARTHQUAKE_ACTIVE') {
                    bossObj.shockwaveRadius += delta * 25.0;
                    bossObj.shockwaveMesh.scale.set(bossObj.shockwaveRadius, bossObj.shockwaveRadius, 1);
                    bossObj.shockwaveMesh.material.opacity = 1.0 - (bossObj.shockwaveRadius / bossObj.shockwaveMaxRadius);

                    const distToPlayer = bossObj.mesh.position.distanceTo(player.mesh.position);
                    if (Math.abs(distToPlayer - bossObj.shockwaveRadius) < 1.5 && player.isAlive && !isEndingSequence && !isGodMode) {
                        if (isGrounded) {
                            player.health -= 40;
                            healthFill.style.width = Math.max(0, player.health) + '%';
                            spawnBlood(player.mesh.position, 10);
                            showDamageIndicator(bossObj.mesh.position);
                            if (player.health <= 0) killPlayerAlways();
                        }
                    }

                    if (bossObj.shockwaveRadius >= bossObj.shockwaveMaxRadius) {
                        bossObj.shockwaveMesh.visible = false;
                        bossObj.state = 'MOVING';
                        bossObj.moveTimer = 0;
                    }
                }
            } else {
                bossObj.mesh.position.x += bossObj.moveDir * delta * 1.5;
                if (Math.abs(bossObj.mesh.position.x) > 15) bossObj.moveDir *= -1;
            }

        } else if (bossObj.type === 'ALE') {
            bossObj.moveTimer += delta;
            bossObj.attackTimer += delta;

            if (!isIgnored && player.isAlive) {
                if (bossObj.state === 'HOVERING') {
                    bossObj.mesh.position.x += bossObj.moveDir * delta * 4.0;
                    if (Math.abs(bossObj.mesh.position.x) > 20) bossObj.moveDir *= -1;

                    bossObj.mesh.position.y = 4.0 + Math.sin(now * 0.003) * 0.8;
                    bossObj.mesh.lookAt(player.mesh.position.x, bossObj.mesh.position.y, player.mesh.position.z);

                    if (bossObj.attackTimer > 3.0) {
                        triggerAleAttack(bossObj);
                    }
                }
            } else {
                bossObj.mesh.position.x += bossObj.moveDir * delta * 2.0;
                if (Math.abs(bossObj.mesh.position.x) > 20) bossObj.moveDir *= -1;
                bossObj.mesh.position.y = 4.0 + Math.sin(now * 0.003) * 0.8;
            }
        }
    });

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
